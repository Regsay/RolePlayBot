<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AnyChars AI</title><script src="https://telegram.org"></script>
<style>
:root{--bg:#0b0b0f;--card:#16161e;--accent:#ff2a7a;--grad:linear-gradient(135deg,#ff2a7a,#ff6b4a);--sub:#8e8ea0}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#121218;border-bottom:1px solid #22222e;z-index:10}
.logo{font-size:19px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pill{background:#22222e;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid #323242}
.screen{flex:1;overflow-y:auto;padding:14px 14px 85px 14px;display:none}
.screen.active{display:block}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.f-btn{background:var(--card);border:1px solid #2a2a38;color:#ccc;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.f-btn.active{background:var(--grad);color:#fff;border:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #252532;position:relative}
.card img{width:100%;height:190px;object-fit:cover;display:block;background:#1f1f2b}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700}
.c-body{padding:10px}
.c-name{font-weight:800;font-size:15px;margin-bottom:3px}
.c-desc{font-size:11px;color:var(--sub);line-height:1.3;height:30px;overflow:hidden;margin-bottom:8px}
.btn{width:100%;padding:10px;border:none;border-radius:10px;background:var(--grad);color:#fff;font-weight:700;font-size:13px}
#scr-chat{padding:0;flex-direction:column;height:100%}
#scr-chat.active{display:flex}
.chat-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#14141c;border-bottom:1px solid #242430}
.chat-hdr img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.aff-bar{font-size:11px;color:#ff6b9d;font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1e1e28;color:#eee;border-bottom-left-radius:4px;border:1px solid #2c2c3a}
.msg em{color:#ff85b3;font-style:italic}
.msg img{width:100%;border-radius:12px;margin-top:6px;display:block}
.chat-in{display:flex;gap:8px;padding:10px 12px 22px 12px;background:#121218;border-top:1px solid #22222e}
.chat-in input{flex:1;background:#1c1c26;border:1px solid #2e2e3d;border-radius:20px;padding:10px 14px;color:#fff;font-size:14px;outline:none}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:#242432;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.send-btn{background:var(--grad)}
.fg{margin-bottom:12px}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
input,textarea,select{width:100%;background:var(--card);border:1px solid #2a2a38;border-radius:12px;padding:12px;color:#fff;font-size:14px;outline:none}
textarea{height:85px;resize:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:#121218;display:flex;border-top:1px solid #22222e;padding:8px 0 18px 0;z-index:20}
.nav-i{flex:1;text-align:center;color:var(--sub);font-size:11px;font-weight:700}
.nav-i.active{color:var(--accent)}
.nav-i span{display:block;font-size:19px;margin-bottom:2px}
</style></head><body>
<div class="top"><div class="logo">ANYCHARS 18+</div><div class="pill" id="bal">⚡️ 15</div></div>
<div id="scr-cat" class="screen active">
<div class="filters"><div class="f-btn active" onclick="filterTag('all',this)">🔥 Все</div><div class="f-btn" onclick="filterTag('Домина',this)">⛓ Домина</div><div class="f-btn" onclick="filterTag('Милая',this)">🌸 Милые</div><div class="f-btn" onclick="filterTag('Игры',this)">🎮 Игры</div></div>
<div class="grid" id="grid"></div></div>
<div id="scr-chat" class="screen">
<div class="chat-hdr"><img id="ch-img" src=""><div style="flex:1"><div style="font-weight:800;font-size:15px" id="ch-name">Макима</div><div class="aff-bar" id="ch-aff">❤️ Симпатия: 15%</div></div><button class="pill" onclick="nav('cat',document.querySelectorAll('.nav-i'))">Каталог</button></div>
<div class="msgs" id="msgs"></div>
<div class="chat-in"><button class="icon-btn" onclick="reqPhoto()" title="Фото">📸</button><input id="inp" placeholder="Напиши сообщение..." onkeypress="if(event.key==='Enter')sendMsg()"><button class="icon-btn send-btn" onclick="sendMsg()">➤</button></div></div>
<div id="scr-new" class="screen"><h3 style="margin-top:0">✨ Конструктор вайфу</h3>
<div class="fg"><label>Имя</label><input id="c-name" placeholder="Например: Рем / Хината"></div>
<div class="fg"><label>Характер, фетиши и сценарий</label><textarea id="c-prompt" placeholder="Опиши её характер и ваши отношения..."></textarea></div>
<div class="fg"><label>Внешность</label><select id="c-look">
<option value="1girl, solo, anime waifu, long pink hair, seductive look, bedroom, masterpiece">Розовые волосы (Аниме)</option>
<option value="1girl, solo, anime goth girl, black hair, red eyes, choker, masterpiece">Брюнетка / Готесса (Аниме)</option>
<option value="1girl, solo, gorgeous blonde woman, blue eyes, fit body, realistic">Блондинка (Реализм)</option>
<option value="1girl, solo, hot brunette woman, long hair, curvy body, realistic">Брюнетка (Реализм)</option></select></div>
<button class="btn" onclick="createChar()">Создать и открыть чат 🔥</button></div>
<div id="scr-vip" class="screen"><div style="background:var(--card);padding:20px;border-radius:16px;border:1px solid var(--accent)">
<h2 style="margin-top:0;color:var(--accent)">👑 ANYCHARS VIP</h2>
<p style="color:#ccc;font-size:14px;line-height:1.6">✅ Безлимитные диалоги 18+<br>✅ Бесконечные горячие фото по сюжету<br>✅ Долгая память персонажа<br>✅ Полное снятие цензуры</p>
<button class="btn" style="padding:14px;font-size:15px" onclick="buyVip()">Активировать VIP — 100 ⭐️</button></div></div>
<div class="nav" id="bnav">
<div class="nav-i active" onclick="nav('cat',this)"><span>🔥</span>Вайфу</div>
<div class="nav-i" onclick="nav('chat',this)"><span>💬</span>Чат</div>
<div class="nav-i" onclick="nav('new',this)"><span>➕</span>Создать</div>
<div class="nav-i" onclick="nav('vip',this)"><span>⭐️</span>VIP</div></div>
<script>
const tg=window.Telegram.WebApp;tg.expand();tg.ready();
let API="";
const uid=tg.initDataUnsafe?.user?.id||12345;
const H={"Content-Type":"application/json"};
let allChars={
"makima":{"name":"Макима","tag":"Домина","img":"https://pollinations.ai","prompt":"Властная и загадочная. Считает тебя своим верным псом и любит полный контроль."},
"zerotwo":{"name":"Зеро Ту (02)","tag":"Милая","img":"https://pollinations.ai","prompt":"Дерзкая и страстная. Называет тебя «Милый» и обожает близость."},
"2b":{"name":"YoRHa 2B","tag":"Игры","img":"https://pollinations.ai","prompt":"Холодная снаружи, но невероятно страстная наедине с тобой."},
"esdeath":{"name":"Генерал Эсдес","tag":"Домина","img":"https://pollinations.ai","prompt":"Безумно влюблена в тебя, готова на всё ради твоей покорности."},
"asuka":{"name":"Аска Лэнгли","tag":"Милая","img":"https://pollinations.ai","prompt":"Классическая цундере — дерзит, но тайно сходит по тебе с ума."},
"hinata":{"name":"Хината Хьюга","tag":"Милая","img":"https://pollinations.ai","prompt":"Скромная и нежная, исполнит любое твоё желание."}
};
function fmt(t){return t.replace(/\*(.*?)\*/g,'<em>*$1*</em>').replace(/\n/g,'<br>')}
function addBubble(role,text,img){
const box=document.getElementById('msgs');const d=document.createElement('div');
d.className='msg '+role;d.innerHTML=fmt(text)+(img?`<img src="${img}">`:'');
box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function renderGrid(tag){
const g=document.getElementById('grid');g.innerHTML='';
Object.entries(allChars).forEach(([id,c])=>{
if(tag!=='all'&&c.tag!==tag)return;
g.innerHTML+=`<div class="card"><span class="tag">${c.tag}</span><img src="${c.img}"><div class="c-body"><div class="c-name">${c.name}</div><div class="c-desc">${c.prompt}</div><button class="btn" onclick="pick('${id}')">Начать чат 💬</button></div></div>`;
});
}
renderGrid('all');
async function init(){
try{
const gr=await fetch(atob("aHR0cHM6Ly9hcGkuZ2l0aHViLmNvbS9yZXBvcy9SZWdzYXkvUm9sZVBsYXlCb3Q="));
const gd=await gr.json();API=gd.description.trim();
const r=await fetch(`${API}/api/init?user_id=${uid}`);const d=await r.json();
document.getElementById('bal').innerText=d.user.is_vip?"👑 VIP":`⚡️ ${d.user.msgs_left}`;
document.getElementById('ch-name').innerText=d.user.char_name;
document.getElementById('ch-img').src=d.user.char_img;
document.getElementById('ch-aff').innerText=`❤️ Симпатия: ${d.user.affection}%`;
document.getElementById('msgs').innerHTML='';
d.messages.forEach(m=>addBubble(m.role,m.content,m.img));
}catch(e){document.getElementById('bal').innerText="Офлайн";}
}
function filterTag(t,el){document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderGrid(t);}
function nav(s,el){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.nav-i').forEach(x=>x.classList.remove('active'));
document.getElementById('scr-'+s).classList.add('active');if(el)el.classList.add('active');
document.getElementById('bnav').style.display=(s==='chat')?'none':'flex';
}
async function pick(id){
const c=allChars[id];
document.getElementById('ch-name').innerText=c.name;document.getElementById('ch-img').src=c.img;
document.getElementById('ch-aff').innerText="❤️ Симпатия: 15%";document.getElementById('msgs').innerHTML='';
addBubble('assistant',`*смотрит прямо тебе в глаза* Привет... Я ${c.name}. О чём пофантазируем?`);nav('chat');
fetch(`${API}/api/select`,{method:"POST",headers:H,body:JSON.stringify({user_id:uid,char_id:id})});
}
async function sendMsg(){
const inp=document.getElementById('inp');const txt=inp.value.trim();if(!txt)return;
inp.value='';addBubble('user',txt);
try{
const r=await fetch(`${API}/api/chat`,{method:"POST",headers:H,body:JSON.stringify({user_id:uid,text:txt})});
const d=await r.json();
if(d.error==='no_limit'){tg.showAlert("Бесплатные сообщения кончились! Открой VIP ⭐️");nav('vip',document.querySelectorAll('.nav-i'));return;}
addBubble('assistant',d.reply);
document.getElementById('ch-aff').innerText=`❤️ Симпатия: ${d.affection}%`;
if(!document.getElementById('bal').innerText.includes('VIP'))document.getElementById('bal').innerText=`⚡️ ${d.msgs_left}`;
}catch(e){addBubble('assistant','*ошибка связи с сервером*');}
}
async function reqPhoto(){
addBubble('assistant','*делает горячее фото... 📸*');
try{
const r=await fetch(`${API}/api/photo`,{method:"POST",headers:H,body:JSON.stringify({user_id:uid})});
const d=await r.json();
if(d.error==='no_limit'){tg.showAlert("Нужен VIP для фото!");return;}
addBubble('assistant','Специально для тебя... 💋',d.img_url);
}catch(e){addBubble('assistant','*ошибка загрузки фото*');}
}
async function createChar(){
const name=document.getElementById('c-name').value.trim(),prompt=document.getElementById('c-prompt').value.trim(),look=document.getElementById('c-look').value;
if(!name||!prompt){tg.showAlert("Заполни поля!");return;}
try{
await fetch(`${API}/api/create`,{method:"POST",headers:H,body:JSON.stringify({user_id:uid,name,prompt,look})});
await init();nav('chat');
}catch(e){tg.showAlert("Нет связи с сервером!");}
}
async function buyVip(){
try{
const r=await fetch(`${API}/api/invoice`,{method:"POST",headers:H,body:JSON.stringify({user_id:uid})});
const d=await r.json();
if(d.invoice_link)tg.openInvoice(d.invoice_link,s=>{if(s==='paid'){tg.showAlert("🎉 VIP активирован!");init();}});
}catch(e){tg.showAlert("Ошибка оплаты");}
}
init();
</script></body></html>
