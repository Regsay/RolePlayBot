<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AnyChars</title><script src="https://telegram.org"></script><style>
:root{--bg:#0b0b0f;--card:#16161e;--accent:#ff2a7a;--grad:linear-gradient(135deg,#ff2a7a,#ff6b4a);--sub:#8e8ea0}
*{box-sizing:border-box;font-family:-apple-system,sans-serif}body{background:var(--bg);color:#fff;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#121218;border-bottom:1px solid #222}
.logo{font-size:19px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pill{background:#222;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700}
.screen{flex:1;overflow-y:auto;padding:14px 14px 85px 14px;display:none}.screen.active{display:block}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}.f-btn{background:var(--card);border:1px solid #333;color:#ccc;padding:6px 14px;border-radius:20px;font-size:12px;white-space:nowrap}.f-btn.active{background:var(--grad);color:#fff;border:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #252532;position:relative}
.card img{width:100%;height:185px;object-fit:cover;display:block;background:#1f1f2b}.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:8px;font-size:10px}
.c-body{padding:10px}.c-name{font-weight:800;font-size:15px;margin-bottom:4px}.c-desc{font-size:11px;color:var(--sub);height:30px;overflow:hidden;margin-bottom:8px}
.btn{width:100%;padding:10px;border:none;border-radius:10px;background:var(--grad);color:#fff;font-weight:700;font-size:13px}
#scr-chat{padding:0;flex-direction:column;height:100%}#scr-chat.active{display:flex}
.chat-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#14141c;border-bottom:1px solid #242430}.chat-hdr img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.msg.user{align-self:flex-end;background:var(--grad);color:#fff}.msg.assistant{align-self:flex-start;background:#1e1e28;color:#eee;border:1px solid #2c2c3a}.msg em{color:#ff85b3}.msg img{width:100%;border-radius:12px;margin-top:6px}
.chat-in{display:flex;gap:8px;padding:10px 12px 22px 12px;background:#121218;border-top:1px solid #222}.chat-in input{flex:1;background:#1c1c26;border:1px solid #333;border-radius:20px;padding:10px 14px;color:#fff;outline:none}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:#242432;color:#fff;font-size:18px}.send-btn{background:var(--grad)}
.fg{margin-bottom:12px}label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}input,textarea,select{width:100%;background:var(--card);border:1px solid #333;border-radius:12px;padding:12px;color:#fff;outline:none}textarea{height:85px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#121218;display:flex;border-top:1px solid #222;padding:8px 0 18px 0}.nav-i{flex:1;text-align:center;color:var(--sub);font-size:11px;font-weight:700}.nav-i.active{color:var(--accent)}.nav-i span{display:block;font-size:19px}
</style></head><body>
<div class="top"><div class="logo">ANYCHARS 18+</div><div class="pill" id="bal">⚡️ 15</div></div>
<div id="scr-cat" class="screen active"><div class="filters"><div class="f-btn active" onclick="fTag('all',this)">🔥 Все</div><div class="f-btn" onclick="fTag('Домина',this)">⛓ Домина</div><div class="f-btn" onclick="fTag('Милая',this)">🌸 Милые</div><div class="f-btn" onclick="fTag('Игры',this)">🎮 Игры</div></div><div class="grid" id="grid"></div></div>
<div id="scr-chat" class="screen"><div class="chat-hdr"><img id="ch-img" src=""><div style="flex:1"><div style="font-weight:800" id="ch-name">Макима</div><div style="font-size:11px;color:#ff6b9d" id="ch-aff">❤️ Симпатия: 15%</div></div><button class="pill" onclick="nav('cat')">Каталог</button></div><div class="msgs" id="msgs"></div><div class="chat-in"><button class="icon-btn" onclick="reqPhoto()">📸</button><input id="inp" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMsg()"><button class="icon-btn send-btn" onclick="sendMsg()">➤</button></div></div>
<div id="scr-new" class="screen"><h3>✨ Создать вайфу</h3><div class="fg"><label>Имя</label><input id="c-name" placeholder="Рем / Хината"></div><div class="fg"><label>Характер</label><textarea id="c-prompt" placeholder="Опиши её..."></textarea></div><div class="fg"><label>Внешность</label><select id="c-look"><option value="1girl, solo, anime waifu, pink hair, bedroom, masterpiece">Аниме (Розовые волосы)</option><option value="1girl, solo, gorgeous blonde woman, realistic">Реализм (Блондинка)</option></select></div><button class="btn" onclick="createChar()">Создать 🔥</button></div>
<div id="scr-vip" class="screen"><div style="background:var(--card);padding:20px;border-radius:16px;border:1px solid var(--accent)"><h2 style="color:var(--accent);margin-top:0">👑 VIP-ДОСТУП</h2><p style="color:#ccc;font-size:14px">✅ Безлимит сообщений 18+<br>✅ Бесконечные фото по сюжету<br>✅ Долгая память</p><button class="btn" style="padding:14px" onclick="buyVip()">Купить VIP — 100 ⭐️</button></div></div>
<div class="nav" id="bnav"><div class="nav-i active" onclick="nav('cat',this)"><span>🔥</span>Вайфу</div><div class="nav-i" onclick="nav('chat',this)"><span>💬</span>Чат</div><div class="nav-i" onclick="nav('new',this)"><span>➕</span>Создать</div><div class="nav-i" onclick="nav('vip',this)"><span>⭐️</span>VIP</div></div>
<script>
const tg=window.Telegram.WebApp;tg.expand();tg.ready();
const API=atob("aHR0cHM6Ly9yb2xlcGxheWJvdC5vbnJlbmRlci5jb20=");
const P=atob("aHR0cHM6Ly9pbWFnZS5wb2xsaW5hdGlvbnMuYWkvcHJvbXB0Lw==");
const uid=tg.initDataUnsafe?.user?.id||12345;
const H={"Content-Type":"application/json"};
const pic=(t,s)=>P+encodeURIComponent(t)+"?width=400&height=550&seed="+s+"&nologo=true";
const chars={
makima:{name:"Макима",tag:"Домина",img:"img/1.jpg",prompt:"Властная и загадочная. Любит полный контроль."},
zerotwo:{name:"Зеро Ту",tag:"Милая",img:"img/2.jpg",prompt:"Дерзкая и страстная. Называет тебя Милый."},
b2:{name:"YoRHa 2B",tag:"Игры",img:"img/3.jpg",prompt:"Холодная снаружи, страстная наедине."},
esdeath:{name:"Эсдес",tag:"Домина",img:"img/4.jpg",prompt:"Безумно влюблена в тебя, жаждет твоей покорности."},
asuka:{name:"Аска",tag:"Милая",img:"img/5.jpg",prompt:"Цундере — дерзит, но тайно сходит по тебе с ума."},
hinata:{name:"Хината",tag:"Милая",img:"img/6.jpg",prompt:"Скромная и нежная, исполнит любое желание."}
};
const fmt=t=>t.replace(/\*(.*?)\*/g,"<em>*$1*</em>").replace(/\n/g,"<br>");
function addB(r,t,i){const b=document.getElementById("msgs"),d=document.createElement("div");d.className="msg "+r;d.innerHTML=fmt(t)+(i?`<img src="${i}">`:"");b.appendChild(d);b.scrollTop=b.scrollHeight;}
function rGrid(tag){const g=document.getElementById("grid");g.innerHTML="";Object.entries(chars).forEach(([id,c])=>{if(tag!=="all"&&c.tag!==tag)return;g.innerHTML+=`<div class="card"><span class="tag">${c.tag}</span><img src="${c.img}"><div class="c-body"><div class="c-name">${c.name}</div><div class="c-desc">${c.prompt}</div><button class="btn" onclick="pick('${id}')">Начать чат 💬</button></div></div>`;});}
rGrid("all");
rGrid("all"); async function init(){try{const r=await fetch(API+"/api/init?user_id="+uid),d=await r.json();document.getElementById("bal").innerText=d.user.is_vip?"👑 VIP":"⚡️ "+d.user.msgs_left;document.getElementById("ch-name").innerText=d.user.char_name;document.getElementById("ch-img").src="img/1.jpg";document.getElementById("ch-aff").innerText="❤️ Симпатия: "+d.user.affection+"%";document.getElementById("msgs").innerHTML="";d.messages.forEach(m=>addB(m.role,m.content,m.img));}catch(e){}}
function fTag(t,el){document.querySelectorAll(".f-btn").forEach(b=>b.classList.remove("active"));el.classList.add("active");rGrid(t);}
function nav(s,el){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".nav-i").forEach(x=>x.classList.remove("active"));document.getElementById("scr-"+s).classList.add("active");if(el)el.classList.add("active");document.getElementById("bnav").style.display=(s==="chat")?"none":"flex";}
async function pick(id){const c=chars[id];document.getElementById("ch-name").innerText=c.name;document.getElementById("ch-img").src=c.img;document.getElementById("ch-aff").innerText="❤️ Симпатия: 15%";document.getElementById("msgs").innerHTML="";addB("assistant",`*смотрит в глаза* Привет... Я ${c.name}. О чём пофантазируем?`);nav("chat");fetch(API+"/api/select",{method:"POST",headers:H,body:JSON.stringify({user_id:uid,char_id:id})});}
async function sendMsg(){const i=document.getElementById("inp"),t=i.value.trim();if(!t)return;i.value="";addB("user",t);try{const r=await fetch(API+"/api/chat",{method:"POST",headers:H,body:JSON.stringify({user_id:uid,text:t})}),d=await r.json();if(d.error==="no_limit"){tg.showAlert("Лимит исчерпан! Открой VIP ⭐️");nav("vip");return;}addB("assistant",d.reply);document.getElementById("ch-aff").innerText="❤️ Симпатия: "+d.affection+"%";if(!document.getElementById("bal").innerText.includes("VIP"))document.getElementById("bal").innerText="⚡️ "+d.msgs_left;}catch(e){addB("assistant","*ошибка связи*");}}
async function reqPhoto(){addB("assistant","*делает фото... 📸*");try{const r=await fetch(API+"/api/photo",{method:"POST",headers:H,body:JSON.stringify({user_id:uid})}),d=await r.json();if(d.error==="no_limit"){tg.showAlert("Нужен VIP!");return;}addB("assistant","Специально для тебя... 💋",d.img_url);}catch(e){addB("assistant","*ошибка фото*");}}
async function createChar(){const n=document.getElementById("c-name").value.trim(),p=document.getElementById("c-prompt").value.trim(),l=document.getElementById("c-look").value;if(!n||!p){tg.showAlert("Заполни поля!");return;}await fetch(API+"/api/create",{method:"POST",headers:H,body:JSON.stringify({user_id:uid,name:n,prompt:p,look:l})});await init();nav("chat");}
async function buyVip(){const r=await fetch(API+"/api/invoice",{method:"POST",headers:H,body:JSON.stringify({user_id:uid})}),d=await r.json();if(d.invoice_link)tg.openInvoice(d.invoice_link,s=>{if(s==="paid"){tg.showAlert("🎉 VIP активирован!");init();}});}
init();
</script></body></html>
